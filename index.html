<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GR26 Check-in</title>
<meta name="theme-color" content="#2A6AD8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--blue:#2A6AD8;--lime:#EEF98A;--pink:#F3A0E3;--cyan:#16A0F2;--navy:#141A2E;--white:#fff;--line:rgba(20,26,46,.12);--muted:#5A6380}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;background:var(--blue);color:var(--navy);-webkit-font-smoothing:antialiased}
header{background:var(--blue)}
.hero{display:block;width:100%;max-width:1100px;margin:0 auto;aspect-ratio:16/9;object-fit:cover}
.stats{max-width:1100px;margin:0 auto;padding:0 16px 18px;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{border-radius:18px;padding:12px 14px;color:var(--navy)}
.stat:nth-child(1){background:var(--lime)}.stat:nth-child(2){background:var(--pink)}.stat:nth-child(3){background:var(--cyan);color:#fff}
.stat .n{font-family:Anton,sans-serif;font-size:clamp(30px,8vw,46px);line-height:1;transform:skewX(-6deg);display:inline-block}
.stat .l{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;margin-top:4px}
.bar{height:7px;background:rgba(20,26,46,.15);border-radius:4px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--navy);width:0;transition:width .3s}
.controls{position:sticky;top:0;z-index:5;background:var(--blue);padding:12px 16px 10px;box-shadow:0 6px 16px rgba(20,26,46,.18)}
.controls>*{max-width:1068px;margin-left:auto;margin-right:auto}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:0;background:var(--navy);border-radius:999px;padding:9px 14px;font:600 13px Inter;color:#fff;cursor:pointer;display:flex;gap:7px;align-items:center}
.tab small{font-weight:500;opacity:.6}
.tab.on{background:var(--lime);color:var(--navy)}
.tab.on small{opacity:.7}
.row2{display:flex;gap:8px;flex-wrap:wrap}.row2 select,.row2 .toggle{height:46px}
.search{flex:1;display:flex;align-items:center;gap:8px;background:#fff;border-radius:14px;padding:0 12px}
.search input{flex:1;border:0;outline:0;font:16px Inter;padding:12px 0;background:transparent;color:var(--navy)}
select{border:0;background:#fff;border-radius:14px;padding:0 10px;font:500 14px Inter;color:var(--navy)}
.toggle{border:0;background:var(--navy);color:#fff;border-radius:14px;padding:0 14px;font:600 13px Inter;cursor:pointer;white-space:nowrap}
.toggle.on{background:var(--pink);color:var(--navy)}
@media (max-width:600px){.search{flex-basis:100%}.row2 select{flex:1}}
main{padding:10px 16px 96px;max-width:1100px;margin:0 auto}
.count{font-size:12px;font-weight:600;color:#fff;opacity:.85;margin:6px 2px 10px;text-transform:uppercase;letter-spacing:.08em}
.p{background:#fff;border-radius:16px;padding:12px 14px;margin-bottom:8px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;border:2px solid transparent}
.p.done{background:var(--lime)}
.who{flex:1 1 200px;min-width:0}
.nm{font-weight:700;font-size:15px;text-transform:capitalize}
.tag{display:inline-block;margin-top:4px;font-size:11px;font-weight:700;letter-spacing:.05em;padding:2px 8px;border-radius:999px;background:#DCEBFF;color:var(--blue)}
.tag.Staff{background:var(--navy);color:var(--lime)}.tag.TeamWR{background:var(--pink);color:var(--navy)}.tag.Guest{background:var(--cyan);color:#fff}
.boxes{display:flex;gap:6px;flex-wrap:wrap}
.cb{display:flex;align-items:center;gap:7px;border:2px solid var(--line);border-radius:12px;padding:7px 10px;font:600 12px Inter;cursor:pointer;user-select:none;background:#fff;color:var(--navy)}
.cb .sq{width:18px;height:18px;border-radius:6px;border:2px solid #9AA3BA;display:grid;place-items:center;transition:.15s}
.cb.on{border-color:var(--navy);background:var(--navy);color:var(--lime)}
.cb.on .sq{background:var(--lime);border-color:var(--lime)}
.cb.on .sq::after{content:"";width:5px;height:9px;border:solid var(--navy);border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.single .cb{padding:10px 14px}.single .cb .sq{width:24px;height:24px}
.empty{text-align:center;color:#fff;padding:40px}
.fab{position:fixed;right:16px;bottom:16px;display:flex;gap:8px}
.fab button{border:0;border-radius:999px;padding:13px 18px;font:700 13px Inter;cursor:pointer;box-shadow:0 8px 22px rgba(20,26,46,.3)}
.fab .exp{background:var(--lime);color:var(--navy)}
.fab .rst{background:var(--navy);color:#fff}
@media (min-width:760px){.p{flex-wrap:nowrap}}
.lock{position:fixed;inset:0;z-index:50;background:var(--blue);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;gap:18px}
.lock img{width:min(560px,100%);border-radius:20px}
.lock form{width:min(420px,100%);display:flex;flex-direction:column;gap:10px}
.lock input{border:0;border-radius:14px;padding:15px 16px;font:16px Inter;outline:3px solid transparent}
.lock input:focus{outline-color:var(--lime)}
.lock button{border:0;border-radius:14px;padding:15px;font:700 15px Inter;background:var(--lime);color:var(--navy);cursor:pointer}
.lock .err{color:var(--lime);font-weight:600;font-size:14px;min-height:18px;text-align:center}
.hidden{display:none!important}
.fab{align-items:center}
.sync{background:var(--navy);color:#fff;border-radius:999px;padding:10px 14px;font:600 12px Inter;box-shadow:0 8px 22px rgba(20,26,46,.3);display:flex;align-items:center;gap:7px}
.sync::before{content:"";width:8px;height:8px;border-radius:50%;background:#9AA3BA}
.sync.ok::before{background:#5BE38F}.sync.wait::before{background:var(--lime)}.sync.off::before{background:#FF6B6B}.sync.local::before{background:var(--pink)}
</style>
</head>
<body>
<div class="lock" id="lock"><img src="banner.jpg" alt="WeRoad Global Reunion – Cruise Edition"><form id="lf"><input type="password" id="pw" placeholder="Password staff" autocomplete="current-password" autofocus><button>Entra</button><div class="err" id="err"></div></form></div>
<header>
  <img class="hero" src="banner.jpg" alt="WeRoad Global Reunion – Cruise Edition">
  <div class="stats">
    <div class="stat"><div class="n" id="sDone">0</div><div class="l" id="sLbl">Check-in fatti</div><div class="bar"><i id="sBar"></i></div></div>
    <div class="stat"><div class="n" id="sLeft">0</div><div class="l">Mancano</div></div>
    <div class="stat"><div class="n" id="sTot">0</div><div class="l">Totale</div></div>
  </div>
</header>

<div class="controls">
  <div class="tabs" id="tabs"></div>
  <div class="row2">
    <label class="search"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6B7A90" stroke-width="2.4"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" placeholder="Cerca nome…" autocomplete="off"></label>
    <select id="grp"></select>
    <button class="toggle" id="todo">Da fare</button>
  </div>
</div>

<main>
  <div class="count" id="count"></div>
  <div id="list"></div>
</main>

<div class="fab"><span class="sync off" id="sync">…</span><button class="exp" id="exp">Esporta CSV</button></div>

let PEOPLE=[];
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unlock(pw){
  const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(ENC.s),iterations:ENC.i,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(ENC.v)},key,b64(ENC.c));
  return JSON.parse(new TextDecoder().decode(pt));
}
const DB_URL="https://gr26-checkin-default-rtdb.europe-west1.firebasedatabase.app"; // Firebase Realtime Database (vuoto = solo locale)
const KEY="gr26-v2-state",PKEY="gr26-v2-pending";
const ls={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(_){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(_){}}};
let state=ls.get(KEY,{}), pending=ls.get(PKEY,{}), PATH="", es=null, live=false;
const k=(i,a)=>i+"_"+a;
const has=(p,ai)=>(p[2]>>ai)&1;
const on=key=>key in pending?!!pending[key]:!!state[key];
let cur="checkin",q="",grp="",todo=false;

async function sha(s){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
function setStatus(){
  const s=document.getElementById("sync"),n=Object.keys(pending).length;
  if(!DB_URL){s.className="sync local";s.textContent="Solo questo dispositivo";return}
  if(live&&!n){s.className="sync ok";s.textContent="Live · sincronizzato"}
  else if(live){s.className="sync wait";s.textContent=`Invio ${n}…`}
  else{s.className="sync off";s.textContent=n?`Offline · ${n} in attesa`:"Offline · riconnessione…"}
}
let rt=null;const rerender=()=>{clearTimeout(rt);rt=setTimeout(()=>{renderTabs();renderStats();renderList()},120)};
function connect(){
  if(!DB_URL)return setStatus();
  if(es)es.close();
  es=new EventSource(`${DB_URL}/${PATH}.json`);
  const apply=(type,ev)=>{const {path,data}=JSON.parse(ev.data);
    if(path==="/"){ if(type==="put")state={}; Object.entries(data||{}).forEach(([key,v])=>{v?state[key]=v:delete state[key]}) }
    else{const key=path.slice(1).split("/")[0]; if(data)state[key]=data; else delete state[key]}
    ls.set(KEY,state);live=true;setStatus();rerender()};
  es.addEventListener("put",e=>apply("put",e));
  es.addEventListener("patch",e=>apply("patch",e));
  es.onopen=()=>{live=true;setStatus();flush()};
  es.onerror=()=>{live=false;setStatus()};
}
let flushing=false;
async function flush(){
  if(!DB_URL||flushing)return;const batch={...pending};if(!Object.keys(batch).length)return setStatus();
  flushing=true;let okk=false;
  try{const r=await fetch(`${DB_URL}/${PATH}.json`,{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify(batch)});
    if(!r.ok)throw 0;
    Object.entries(batch).forEach(([key,v])=>{if(pending[key]===v)delete pending[key]; v?state[key]=v:delete state[key]});
    ls.set(PKEY,pending);ls.set(KEY,state);okk=true;if(!live&&es&&es.readyState!==1)connect()}
  catch(_){live=false}
  flushing=false;setStatus();
  if(Object.keys(pending).length)setTimeout(flush,okk?0:3000);
}
addEventListener("online",()=>{connect();flush()});
setInterval(()=>{if(!DB_URL||!PATH)return;if(!es||es.readyState===2)connect();else if(es.readyState===1&&!live){live=true;setStatus()}if(Object.keys(pending).length)flush()},8000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&DB_URL&&(!es||es.readyState===2))connect()});

async function start(pw){
  PATH="gr26/"+(await sha("gr26|"+pw)).slice(0,32);
  const groups=[...new Set(PEOPLE.map(p=>p[1]))].sort();
  document.getElementById("grp").innerHTML='<option value="">Tutti i gruppi</option>'+groups.map(g=>`<option>${g}</option>`).join("");
  all();connect();flush();setStatus();
}
function totals(a){const ai=ACTS.findIndex(x=>x[0]===a);let t=0,d=0;PEOPLE.forEach((p,i)=>{if(has(p,ai)){t++;if(on(k(i,a)))d++}});return[d,t]}
function renderTabs(){
  const sl=tabs.scrollLeft;
  tabs.innerHTML=[["all","Tutte"],...ACTS].map(([id,l])=>{
    const c=id==="all"?"":(()=>{const[d,t]=totals(id);return`<small>${d}/${t}</small>`})();
    return`<button class="tab ${cur===id?"on":""}" data-id="${id}">${l}${c}</button>`}).join("");
  tabs.scrollLeft=sl;
}
function renderStats(){
  const a=cur==="all"?"checkin":cur;const[d,t]=totals(a);
  sDone.textContent=d;sLeft.textContent=t-d;sTot.textContent=t;sBar.style.width=(t?d/t*100:0)+"%";
  sLbl.textContent=(ACTS.find(x=>x[0]===a)[1])+" fatti";
}
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function box(i,a,l){return`<label class="cb ${on(k(i,a))?"on":""}" data-i="${i}" data-a="${a}"><span class="sq"></span>${l}</label>`}
function renderList(){
  const ai=ACTS.findIndex(x=>x[0]===cur);const qq=q.trim().toLowerCase();
  const rows=[];
  PEOPLE.forEach((p,i)=>{
    if(cur!=="all"&&!has(p,ai))return;
    if(grp&&p[1]!==grp)return;
    if(qq&&!p[0].toLowerCase().includes(qq))return;
    if(todo){ if(cur==="all"){ if(ACTS.every(([a],j)=>!has(p,j)||on(k(i,a))))return } else if(on(k(i,cur)))return }
    rows.push(i)});
  count.textContent=rows.length+" persone";
  const html=rows.slice(0,400).map(i=>{const p=PEOPLE[i];
    const bx=cur==="all"?ACTS.filter((_,j)=>has(p,j)).map(([a,l])=>box(i,a,l)).join(""):box(i,cur,"Fatto");
    const done=cur==="all"?ACTS.every(([a],j)=>!has(p,j)||on(k(i,a))):on(k(i,cur));
    return`<div class="p ${done?"done":""}"><div class="who"><div class="nm">${esc(p[0].toLowerCase())}</div><span class="tag ${p[1].replace(/\s/g,"")}">${esc(p[1])}</span></div><div class="boxes ${cur==="all"?"":"single"}">${bx}</div></div>`}).join("");
  list.innerHTML=html||'<div class="empty">Nessuno trovato</div>';
  if(rows.length>400)list.insertAdjacentHTML("beforeend",`<div class="empty">Altri ${rows.length-400}: affina la ricerca</div>`);
}
const all=()=>{renderTabs();renderStats();renderList()};
tabs.onclick=e=>{const b=e.target.closest(".tab");if(!b)return;cur=b.dataset.id;all()};
document.getElementById("q").oninput=e=>{q=e.target.value;renderList()};
document.getElementById("grp").onchange=e=>{grp=e.target.value;renderList()};
document.getElementById("todo").onclick=e=>{todo=!todo;e.target.classList.toggle("on",todo);renderList()};
list.onclick=e=>{const c=e.target.closest(".cb");if(!c)return;e.preventDefault();
  const key=k(+c.dataset.i,c.dataset.a);pending[key]=on(key)?null:Date.now();
  if(!DB_URL){pending[key]?state[key]=pending[key]:delete state[key];delete pending[key];ls.set(KEY,state)}
  ls.set(PKEY,pending);c.classList.toggle("on");renderTabs();renderStats();rerender();setStatus();flush()};
document.getElementById("exp").onclick=()=>{
  const head=["Nome","Gruppo",...ACTS.map(a=>a[1])];
  const lines=PEOPLE.map((p,i)=>[p[0],p[1],...ACTS.map(([a],j)=>has(p,j)?(on(k(i,a))?"SI":"no"):"")].map(v=>`"${v}"`).join(","));
  const blob=new Blob(["﻿"+[head.join(","),...lines].join("\n")],{type:"text/csv"});

document.getElementById("lf").onsubmit=async e=>{e.preventDefault();const pw=document.getElementById("pw").value;
